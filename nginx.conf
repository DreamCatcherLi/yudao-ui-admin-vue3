events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log;
    
    # 基本设置
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    server {
        listen 80;
        server_name localhost;
        
        # 设置根目录为 nginx 默认的前端文件目录
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # 处理 /admin-ui-vue3/ 路径，映射到实际的前端文件
        location ^~ /admin-ui-vue3/ {
            # 移除 /admin-ui-vue3/ 前缀，直接访问根目录下的文件
            rewrite ^/admin-ui-vue3/(.*)$ /$1 break;
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # 确保静态资源请求能正确找到文件
            try_files $uri $uri/ =404;
        }
        
        # SPA 路由处理
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # API 代理到后端服务 - 根据 .env.test 配置
        location /admin-api/ {
            proxy_pass http://yudao-server:48080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # WebSocket 代理
        location /infra/ws {
            proxy_pass http://yudao-server:48080/infra/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # 日志设置
        access_log /var/log/nginx/frontend-access.log;
        error_log /var/log/nginx/frontend-error.log;
    }
}